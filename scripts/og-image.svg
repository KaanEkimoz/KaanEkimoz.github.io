    </pattern>
    <radialGradient id="glow" cx="85%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#ff4dff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff4dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="15%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#00d9ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00d9ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0a0a14"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <g fill="none" stroke-width="2.5" opacity="0.55">
