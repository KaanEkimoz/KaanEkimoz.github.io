# Cloudflare Worker for the /chat page. See worker/README.md for deploy steps.
# Secrets (ANTHROPIC_API_KEY, ACCESS_TOKEN) are NOT in this file — add them
# with `npx wrangler secret put <NAME>`.

name = "kaanusta-chat"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Serve on <name>.<your-subdomain>.workers.dev.
workers_dev = true

[vars]
# Origins allowed by CORS. For local testing against `npm run dev`, add
# http://localhost:4321 temporarily, then remove it and redeploy.
ALLOWED_ORIGINS = "https://kaanusta.dev,https://www.kaanusta.dev,https://kaanekimoz.github.io"

# Per-IP rate limit: 60 requests per 60 seconds (opening the page syncs
# history, so one visit makes a few requests). Also throttles password
# guessing, since it runs before the token check. `namespace_id` is any
# positive integer unique within your account.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "4101"

  [ratelimits.simple]
  limit = 60
  period = 60

# Per-user chat history and settings. Schema lives in migrations/; apply
# with `npx wrangler d1 migrations apply kaanusta-chat --remote`.
[[d1_databases]]
binding = "DB"
database_name = "kaanusta-chat"
database_id = "e9da0476-502f-4673-a5f5-e17736a5957e"
migrations_dir = "migrations"

[observability]
enabled = true
